<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Confirmed — A1A Trailer Rentals</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f4f0;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{max-width:480px;margin:2rem;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.08)}
.hero{background:#0a1628;padding:2rem;text-align:center}
.hero .check{font-size:40px;color:#27a844;margin-bottom:8px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:#fff}
.body{padding:1.75rem 2rem;text-align:center;color:#555;font-size:14px;line-height:1.7}
.body strong{color:#111}
.phone{margin-top:1.25rem;font-size:13px;color:#888}
</style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <div class="check">&#10003;</div>
      <h1>Payment Confirmed</h1>
    </div>
    <div class="body">
      <p>Thanks! Your rental fee and security deposit have been received.</p>
      <p style="margin-top:10px">We'll text or call you shortly with your pickup details and access code for your contactless pickup.</p>
      <p class="phone">A1A Trailer Rentals &nbsp;|&nbsp; 904-417-8106 &nbsp;|&nbsp; St. Augustine, FL</p>
    </div>
  </div>
</body>
</html>
